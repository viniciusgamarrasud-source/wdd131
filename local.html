<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brasil</title>

    <meta name="description" content="Conheça informações sobre o Brasil, incluindo dados geográficos, clima, cultura e imagens responsivas em uma página web moderna.">
    <meta name="author" content="Vinícius Gamarra">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="estilos/local.css">
    
    <script src="scripts/local.js" defer></script>
   
</head>

<body>

<header>
    <h1>Brasil</h1>
</header>

<main>

    <picture>
        <source srcset="imagens/brasil-pequeno.webp" media="(max-width: 768px)">
        <img src="imagens/brasil-grande.webp"
             alt="Paisagem do Brasil"
             width="1200"
             height="600">
    </picture>

    <section class="dados">
        <h2>Dados</h2>

        <p><strong>Capital:</strong> Brasília</p>
        <p><strong>População:</strong> 203 milhões</p>
        <p><strong>Idioma:</strong> Português</p>
        <p><strong>Moeda:</strong> Real (R$)</p>
        <p><strong>Continente:</strong> América do Sul</p>
    </section>

    <section class="weather">
    <h2>Clima</h2>

 <svg
    class="weather-icon"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 100 100"
    width="80"
    height="80">

    <circle cx="50" cy="50" r="20" fill="gold"/>

    <line x1="50" y1="10" x2="50" y2="25" stroke="orange" stroke-width="4"/>
    <line x1="50" y1="75" x2="50" y2="90" stroke="orange" stroke-width="4"/>
    <line x1="10" y1="50" x2="25" y2="50" stroke="orange" stroke-width="4"/>
    <line x1="75" y1="50" x2="90" y2="50" stroke="orange" stroke-width="4"/>
</svg>

    <p>Temperatura: <span id="temp">8</span> °C</p>
    <p>Velocidade do vento: <span id="wind">10</span> km/h</p>
    <p>Sensação térmica: <span id="windchill"></span></p>
</section>

</main>

<footer>
    <p>
        ©<span id="currentyear"></span>
        🌺 Vinícius Gamarra 🌺 Brasil
    </p>

    <p id="lastModified"></p>
</footer>

</body>
</html>
